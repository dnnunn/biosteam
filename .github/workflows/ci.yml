name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/pkgs/biosteam/src:${{ github.workspace }}/pkgs/thermosteam/src"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install Thermo/BioSTEAM runtime deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.22,<1.27" "pandas>=2.2" chemicals thermo fluids scipy "numba<0.60" llvmlite matplotlib plotly ipython SALib pydantic
      - name: Install vendored ThermoSTEAM (editable, no deps)
        run: |
          set -e
          echo "Attempting editable install of vendored ThermoSTEAM"
          for path in pkgs/thermosteam/src/thermosteam pkgs/thermosteam/src pkgs/thermosteam; do
            if [ -e "$path" ]; then
              echo "Trying: $path"
              if python -m pip install -e "$path" --no-deps; then
                echo "Installed ThermoSTEAM from $path"
                break
              else
                echo "Install from $path failed; trying next candidate" >&2
              fi
            fi
          done
          python -c "import importlib; import sys; importlib.import_module('thermosteam'); print('thermosteam import OK')"
      - name: Install API
        run: |
          cd app/api
          python -m pip install -e . --no-deps
      - name: Run tests
        run: |
          cd app/api
          python -m pip install pytest
          # Bypass root pytest.ini (which narrows discovery) and target API tests
          pytest -q tests -c /dev/null
