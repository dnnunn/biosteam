name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/pkgs/biosteam/src:${{ github.workspace }}/pkgs/thermosteam/src"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install Thermo/BioSTEAM runtime deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pandas>=2.2" chemicals thermo fluids scipy numba matplotlib plotly ipython
      - name: Install API
        run: |
          cd app/api
          python -m pip install -e .
      - name: Run tests
        run: |
          cd app/api
          python -m pip install pytest
          pytest -q
