name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/pkgs/biosteam/src:${{ github.workspace }}/pkgs/thermosteam/src"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install Thermo/BioSTEAM runtime deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.22,<1.27" "pandas>=2.2" chemicals thermo fluids scipy "numba<0.60" llvmlite matplotlib plotly ipython SALib
      - name: Install API
        run: |
          cd app/api
          python -m pip install -e . --no-deps
      - name: Run tests
        run: |
          cd app/api
          python -m pip install pytest
          pytest -q
