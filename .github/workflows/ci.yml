name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install vendored ThermoSTEAM
        run: |
          python -m pip install --upgrade pip
          # Install base dependencies first
          python -m pip install "numpy>=1.22,<1.27" "pandas>=2.2" chemicals thermo fluids scipy pyyaml
          # Install vendored ThermoSTEAM (no deps to avoid conflicts)
          python -m pip install -e pkgs/thermosteam/src --no-deps
      - name: Install vendored BioSTEAM
        run: |
          # Install BioSTEAM dependencies and vendored package
          python -m pip install "numba<0.60" llvmlite matplotlib plotly ipython SALib pydantic
          python -m pip install -e pkgs/biosteam/src --no-deps
      - name: Verify vendored packages
        run: |
          python -c "import thermosteam; print('✓ thermosteam:', thermosteam.__file__)"
          python -c "import biosteam; print('✓ biosteam:', biosteam.__file__)"
      - name: Install API
        run: |
          cd app/api
          python -m pip install -e . --no-deps
      - name: Run tests
        run: |
          cd app/api
          python -m pip install pytest
          # Run all API tests with vendored packages
          pytest -v tests/
