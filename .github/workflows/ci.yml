name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Use vendored packages via PYTHONPATH (no pip install to avoid dependency conflicts)
      # thermosteam is double-nested: pkgs/thermosteam/src/thermosteam/thermosteam/
      # biosteam is single-nested: pkgs/biosteam/src/biosteam/
      PYTHONPATH: "${{ github.workspace }}/pkgs/thermosteam/src/thermosteam:${{ github.workspace }}/pkgs/biosteam/src:${{ github.workspace }}"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Required to checkout thermosteam submodule
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Debug vendored package structure
        run: |
          echo "=== Checking thermosteam structure ==="
          ls -la pkgs/thermosteam/src/
          echo ""
          echo "=== Checking for thermosteam package ==="
          ls -la pkgs/thermosteam/src/thermosteam/ | head -20
          echo ""
          echo "=== Looking for __init__.py ==="
          find pkgs/thermosteam/src -name "__init__.py" -type f | head -5
          echo ""
          echo "=== Checking biosteam structure ==="
          ls -la pkgs/biosteam/src/ | head -15
      - name: Install dependencies (all from setup.py + runtime imports)
        run: |
          python -m pip install --upgrade pip
          # Install all dependencies in one go to let pip resolve versions
          python -m pip install \
            "numpy>=1.22,<1.27" \
            "pandas>=2.2" \
            scipy \
            pyyaml \
            pint \
            "thermo>=0.4.2" \
            fluids \
            chemicals \
            "IPython>=7.9.0" \
            "colorpalette>=0.3.3" \
            "matplotlib>=3.0" \
            xlrd \
            openpyxl \
            "flexsolve>=0.5.9" \
            coolprop \
            imageio \
            pydot \
            pyglet \
            graphviz \
            chaospy \
            "numba<0.60" \
            llvmlite \
            plotly \
            SALib \
            pydantic \
            pytest
      - name: Verify vendored packages are on PYTHONPATH
        run: |
          python -c "import thermosteam; print('✓ thermosteam:', thermosteam.__file__)"
          python -c "import biosteam; print('✓ biosteam:', biosteam.__file__)"
      - name: Install API
        run: |
          cd app/api
          python -m pip install -e . --no-deps
      - name: Debug test setup
        run: |
          echo "=== Checking test files exist ==="
          ls -la app/api/tests/test_*.py
          echo ""
          echo "=== Checking for __init__.py files ==="
          find app -name "__init__.py" | head -20
          echo ""
          echo "=== Checking package structure ==="
          python -c "import sys; sys.path.insert(0, '.'); import app.api.tests.test_smoke; print('✓ Can import test_smoke')" || echo "✗ Cannot import tests"
          echo ""
          echo "=== Pytest collection with verbose output ==="
          pytest --collect-only -v app/api/tests/ --override-ini="python_files=test_*.py" 2>&1 || echo "Collection failed: $?"
          echo ""
          echo "=== Try running test_smoke directly ==="
          python -c "import sys; sys.path.insert(0, '.'); from app.api.tests.test_smoke import test_smoke; test_smoke(); print('✓ test_smoke passed')" || echo "✗ Direct execution failed"
      - name: Run tests
        run: |
          # Override root pytest.ini which only looks for test_opn_*.py in tests/
          # We need to run API tests in app/api/tests/ with standard test_*.py naming
          pytest -v app/api/tests/ --override-ini="python_files=test_*.py" --override-ini="testpaths=app/api/tests"
